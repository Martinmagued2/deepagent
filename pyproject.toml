[project]
name = "deep-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Martin", email = "tinomagued@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.14",
    "fastapi>=0.141.1",
    "keyring>=25.0.0",
    "langchain-openai>=1.6.6",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.11",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
    "requests>=2.32.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
nexusai = "deep_agent:main"
deep-agent = "deep_agent:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

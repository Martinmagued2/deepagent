<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI Studio — Autonomous AI Developer Environment</title>
    <meta name="description" content="Next-Generation Desktop AI IDE & Autonomous Software Engineering Environment">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- React 18 & Babel — MUST load BEFORE Monaco's AMD loader,
         otherwise Monaco's window.define.amd hijacks these UMD builds
         and React/ReactDOM/Babel never set window globals,
         which results in a blank page (no React mount). -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>

    <!-- Monaco Editor Loader — load AFTER React/ReactDOM/Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body class="nexus-ide-body">
    <div id="root"></div>
    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
